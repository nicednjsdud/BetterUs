spring:
  # 운영 DB(MySQL) 접속 정보는 소스에 두지 않는다 — 서버에서 환경 변수로 주입한다.
  # (DB_URL / DB_USERNAME / DB_PASSWORD / DB_DRIVER)
  datasource:
    url: ${DB_URL:jdbc:h2:tcp://localhost/~/test2}
    username: ${DB_USERNAME:sas}
    password: ${DB_PASSWORD:12}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  profiles:
    active: local

  devtools:
    livereload:
      enabled: true
    freemarker:
      cache: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        #          show_sql: true
        format_sql: true
  # Naver smtp server 사용
  mail:
    host: smtp.naver.com #smtp 서버 주소
    port: 465 # 메일 인증서버 포트
    # 메일 계정은 소스에 두지 않는다 — 로컬은 application-local.yml, 서버는 환경 변수.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
          #            required: true
          auth: true
          #          connectiontimeout: 5000
          #          timeout: 5000
          #          writetimeout: 5000
          ssl:
            #trust: smtp.naver.com
            enable: true #반드시 필요 -> SSL 필요로 되어있으면
    servlet:
      multipart:
        maxFileSize: 10MB
        maxRequestSize: 20MB

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace

thymeleaf:
  prefix: classpath:/templates/
  suffix: .html
  check-template-location: true
  cache: false
  mvc:
    static-path-pattern: /static/**
server:
  port : 8080
  servlet:
    # 요청·응답을 항상 UTF-8 로 처리한다 — 한글 글쓰기(파일 업로드 폼)에서
    # 한글이 깨져 저장되던 문제를 막는다.
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      # 세션을 쿠키로만 유지한다 — 주소 뒤에 세션 표시(;jsessionid=…)가 붙어
      # 로그인 후 이동한 화면이 404 가 되는 것을 막는다.
      tracking-modes: cookie

# Better Us 자체 설정
app:
  mail:
    auth:
      # 이메일 인증 건너뛰기 — 켜면 인증코드를 보내지 않고 인증 단계를 통과시킨다.
      # 메일 계정 없이 화면을 확인하는 개발 환경용. 운영에서는 반드시 false 로 둔다.
      skip: ${MAIL_AUTH_SKIP:false}
