<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>작가신청 글 목록 · Better Us</title>
    <link rel="stylesheet" th:href="@{/css/common/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/member/member.css}" />
  </head>
  <body class="member-page">
    <div th:replace="~{fragments/layout :: header}"></div>

    <div class="member-layout">
      <aside th:replace="~{fragments/layout :: adminNav('reviews')}"></aside>

      <main class="member-main">
        <h1 class="member-page-title ez-serif">작가신청 글 목록</h1>
        <p class="member-page-desc">작가를 신청한 회원의 글을 확인하고 승인 여부를 정합니다.</p>

        <p class="ez-note" th:if="${msg}" th:text="${msg}" role="status"></p>

        <form class="search-bar" method="GET" th:action="@{/myPage/admin/article/search}" style="margin-top:0">
          <input type="text" name="searchKeyword" class="ez-input" th:value="${param.searchKeyword}" placeholder="제목으로 검색" />
          <button type="submit" class="ez-btn ez-btn--primary">검색</button>
          <a class="ez-btn ez-btn--ghost" th:if="${param.searchKeyword != null and !#strings.isEmpty(param.searchKeyword)}"
             th:href="@{/myPage/admin/articleConfirmCheck}">초기화</a>
        </form>

        <div class="empty-state" th:if="${articleList == null or articleList.totalElements == 0}">
          <img th:src="@{/img/empty-review.jpg}" alt="" style="width:200px" />
          <p>심사할 신청 글이 없어요.</p>
        </div>

        <table class="data-table" th:unless="${articleList == null or articleList.totalElements == 0}">
          <thead>
            <tr>
              <th>제목</th>
              <th>신청자</th>
              <th>이메일</th>
              <th>신청일</th>
              <th>심사</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="article : ${articleList.content}">
              <td th:text="${article.title}">제목</td>
              <td th:text="${article.nickName}">신청자</td>
              <td th:text="${article.email}">메일</td>
              <td th:text="${article.authorConfirmDate}">-</td>
              <td>
                <a class="ez-btn ez-btn--ghost" style="height:32px"
                   th:href="@{'/myPage/admin/articleConfirmCheck/article/' + ${article.id}}">보기</a>
              </td>
            </tr>
          </tbody>
        </table>

        <nav class="pagination" th:if="${articleList != null and articleList.totalPages > 1}">
          <th:block th:each="page : ${#numbers.sequence(startPage, endPage)}">
            <a th:if="${page != nowPage}"
               th:href="${param.searchKeyword != null and !#strings.isEmpty(param.searchKeyword)}
                        ? @{/myPage/admin/article/search(searchKeyword=${param.searchKeyword}, page=${page-1})}
                        : @{/myPage/admin/articleConfirmCheck(page=${page-1})}"
               th:text="${page}">1</a>
            <span class="is-current" th:if="${page == nowPage}" th:text="${page}">1</span>
          </th:block>
        </nav>
      </main>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
  </body>
</html>
