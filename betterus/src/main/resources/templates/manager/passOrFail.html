<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>작가신청 글 상세 · Better Us</title>
    <link rel="stylesheet" th:href="@{/css/common/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/member/member.css}" />
    <link rel="stylesheet" th:href="@{/css/public/public.css}" />
  </head>
  <body class="member-page">
    <div th:replace="~{fragments/layout :: header}"></div>

    <div class="member-layout">
      <aside th:replace="~{fragments/layout :: adminNav('reviews')}"></aside>

      <main class="member-main">
        <h1 class="member-page-title ez-serif">작가신청 글 상세</h1>
        <p class="member-page-desc">신청 글을 읽고 작가 승급을 결정합니다.</p>

        <p class="ez-note" th:if="${msg}" th:text="${msg}" role="status"></p>

        <article class="form-card" style="margin-bottom:24px">
          <h2 class="ez-serif" style="font-size:24px;margin:0 0 8px" th:text="${article.title}">제목</h2>
          <p style="font-size:16px;color:var(--ez-text-muted);margin:0 0 16px" th:text="${article.subTitle}">부제</p>
          <div class="reading__byline" style="border-top:1px solid var(--ez-border);border-bottom:1px solid var(--ez-border);padding:12px 0">
            <span th:text="${article.nickName}">신청자</span>
            <span aria-hidden="true">·</span>
            <span th:text="${article.createDate}">신청일</span>
          </div>
          <div class="reading__body" th:text="${article.contents}">본문</div>
        </article>

        <section class="status-strip">
          <div>
            <div class="status-strip__text" th:text="'신청자 소개: ' + (${article.user_info} ?: '없음')">신청자 소개</div>
          </div>
          <div style="display:flex;gap:12px">
            <a class="ez-btn ez-btn--primary"
               th:href="@{'/myPage/admin/pass/' + ${article.memberId}}"
               onclick="return confirm('이 회원을 작가로 승인할까요?');">승인</a>
            <a class="ez-btn ez-btn--ghost"
               th:href="@{'/myPage/admin/fail/' + ${article.memberId}}"
               onclick="return confirm('이 신청을 불승인할까요?');">불승인</a>
            <a class="ez-btn ez-btn--text" th:href="@{/myPage/admin/articleConfirmCheck}">목록으로</a>
          </div>
        </section>
      </main>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
  </body>
</html>
