<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원목록 · Better Us</title>
    <link rel="stylesheet" th:href="@{/css/common/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/member/member.css}" />
  </head>
  <body class="member-page">
    <div th:replace="~{fragments/layout :: header}"></div>

    <div class="member-layout">
      <aside th:replace="~{fragments/layout :: adminNav('members')}"></aside>

      <main class="member-main">
        <h1 class="member-page-title ez-serif">회원목록</h1>
        <p class="member-page-desc">가입한 회원과 등급, 가입일을 한눈에 봅니다.</p>

        <p class="ez-note" th:if="${msg}" th:text="${msg}" role="status"></p>

        <form class="search-bar" method="GET" th:action="@{/myPage/admin/memberInfo/search}" style="margin-top:0">
          <input type="text" name="searchKeyword" class="ez-input" th:value="${param.searchKeyword}" placeholder="닉네임으로 검색" />
          <button type="submit" class="ez-btn ez-btn--primary">검색</button>
          <a class="ez-btn ez-btn--ghost" th:if="${param.searchKeyword != null and !#strings.isEmpty(param.searchKeyword)}"
             th:href="@{/myPage/admin/memberInfo}">초기화</a>
        </form>

        <div class="empty-state" th:if="${memberList == null or memberList.totalElements == 0}">
          <img th:src="@{/img/empty-review.jpg}" alt="" style="width:200px" />
          <p>조건에 맞는 회원이 없어요.</p>
        </div>

        <table class="data-table" th:unless="${memberList == null or memberList.totalElements == 0}">
          <thead>
            <tr>
              <th>닉네임</th>
              <th>이메일</th>
              <th>등급</th>
              <th>가입일</th>
              <th>작가 승인일</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="member : ${memberList.content}">
              <td th:text="${member.nickName}">회원</td>
              <td th:text="${member.email}">메일</td>
              <td>
                <span class="ez-badge" th:switch="${member.grade != null ? member.grade.name() : ''}">
                  <th:block th:case="'AUTHOR'">작가</th:block>
                  <th:block th:case="'ADMIN'">관리자</th:block>
                  <th:block th:case="*">일반회원</th:block>
                </span>
              </td>
              <td th:text="${member.createDate}">-</td>
              <td th:text="${member.authorConfirmDate}">-</td>
            </tr>
          </tbody>
        </table>

        <nav class="pagination" th:if="${memberList != null and memberList.totalPages > 1}">
          <th:block th:each="page : ${#numbers.sequence(startPage, endPage)}">
            <a th:if="${page != nowPage}"
               th:href="${param.searchKeyword != null and !#strings.isEmpty(param.searchKeyword)}
                        ? @{/myPage/admin/memberInfo/search(searchKeyword=${param.searchKeyword}, page=${page-1})}
                        : @{/myPage/admin/memberInfo(page=${page-1})}"
               th:text="${page}">1</a>
            <span class="is-current" th:if="${page == nowPage}" th:text="${page}">1</span>
          </th:block>
        </nav>
      </main>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
  </body>
</html>
