<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원정보 수정 · Better Us</title>
    <link rel="stylesheet" th:href="@{/css/common/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/member/member.css}" />
  </head>
  <body class="member-page">
    <div th:replace="~{fragments/layout :: header}"></div>

    <div class="member-layout">
      <aside th:replace="~{fragments/layout :: memberNav('info')}"></aside>

      <main class="member-main">
        <h1 class="member-page-title ez-serif">회원정보 수정</h1>
        <p class="member-page-desc" th:text="${memberList.nickName} + '님의 계정 정보입니다.'">계정 정보</p>

        <p class="ez-error" th:if="${msg}" th:text="${msg}" role="alert"></p>

        <form id="editForm" class="form-card"
              th:action="@{'/editInfo/' + ${memberList.id} + '/edit'}" method="post">

          <div class="form-row">
            <label for="nickName">닉네임</label>
            <div class="form-row__body">
              <input id="nickName" name="nickName" type="text" class="ez-input"
                     th:value="${memberList.nickName}" />
              <div id="nickMsg" class="field-msg"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="email">이메일</label>
            <div class="form-row__body">
              <input id="email" name="email" type="email" class="ez-input" th:value="${memberList.email}" />
            </div>
          </div>

          <div class="form-row">
            <label for="phone">전화번호 (선택)</label>
            <div class="form-row__body">
              <input id="phone" name="phone" type="tel" class="ez-input" th:value="${phone}" />
            </div>
          </div>

          <div class="form-row">
            <label for="info">소개글</label>
            <div class="form-row__body">
              <textarea id="info" name="info" th:text="${memberList.user_info}"></textarea>
            </div>
          </div>

          <div class="form-row">
            <label for="newPassword">변경할 비밀번호</label>
            <div class="form-row__body">
              <input id="newPassword" name="newPassword" type="password" class="ez-input"
                     placeholder="변경하지 않으면 비워 두세요" />
            </div>
          </div>

          <div class="form-row">
            <label for="currentPassword">현재 비밀번호</label>
            <div class="form-row__body">
              <input id="currentPassword" name="currentPassword" type="password" class="ez-input"
                     placeholder="비밀번호를 바꾸거나 탈퇴할 때 입력" />
              <div id="pwMsg" class="field-msg"></div>
            </div>
          </div>

          <div class="form-row">
            <label>등급</label>
            <div class="form-row__body readonly-value">
              <span class="ez-badge" th:switch="${memberList.grade != null ? memberList.grade.name() : ''}">
                <th:block th:case="'AUTHOR'">작가</th:block>
                <th:block th:case="'ADMIN'">관리자</th:block>
                <th:block th:case="*">일반회원</th:block>
              </span>
            </div>
          </div>

          <div class="form-row">
            <label>가입일 / 작가 승인일</label>
            <div class="form-row__body readonly-value"
                 th:text="${createDate} + '  ·  ' + ${authorConfirmDate}">-</div>
          </div>

          <div class="form-actions">
            <button type="submit" class="ez-btn ez-btn--primary">저장</button>
          </div>
        </form>

        <!-- 위험 구역: 회원 탈퇴 -->
        <section class="danger-zone">
          <h3 class="ez-serif">회원 탈퇴</h3>
          <p>탈퇴하면 되돌릴 수 없습니다. 작성한 글과 활동 기록도 모두 삭제됩니다.</p>
          <form id="deleteForm" th:action="@{'/editInfo/' + ${memberList.id} + '/delete'}" method="post"
                class="danger-zone__form">
            <input type="password" id="deletePassword" name="currentPassword" class="ez-input"
                   placeholder="현재 비밀번호 입력" />
            <button type="submit" class="ez-btn ez-btn--danger">회원 탈퇴</button>
          </form>
        </section>
      </main>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script th:src="@{/js/myPage/myPage(info).js}"></script>
  </body>
</html>
