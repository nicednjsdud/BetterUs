<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Better Us · 글을 쓰며 더 나은 ‘나’로</title>
    <link rel="stylesheet" th:href="@{/css/common/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/public/public.css}" />
  </head>
  <body class="public-page">
    <div th:replace="~{fragments/layout :: header}"></div>

    <p class="ez-note" th:if="${msg}" th:text="${msg}" role="status"
       style="max-width:1200px;margin:16px auto 0"></p>

    <!-- 히어로 -->
    <section class="hero">
      <div class="hero__overlay"></div>
      <div class="hero__inner">
        <h1 class="hero__slogan">글을 쓰며 더 나은 ‘나’로,<br />글을 나누며 더 나은 ‘우리’로</h1>
        <p class="hero__sub">쓰고 싶은 사람의 글쓰기, 읽고 싶은 사람의 서재</p>
        <div class="hero__actions">
          <a class="ez-btn ez-btn--primary" th:href="@{/list/article}">에세이 읽어보기</a>
          <a class="ez-btn ez-btn--on-image" th:href="@{/write}">글쓰기 시작하기</a>
        </div>
      </div>
    </section>

    <div class="public-container">
      <!-- 편집자가 고른 글 -->
      <section class="public-section" th:if="${mainPageList != null and mainPageList.articleList != null and !#lists.isEmpty(mainPageList.articleList)}">
        <div class="section-title-row">
          <h2>편집자가 고른 글</h2>
          <a class="more" th:href="@{/list/article}">전체 보기 ›</a>
        </div>
        <div class="card-grid">
          <a class="article-card" th:each="article : ${mainPageList.articleList}"
             th:href="@{'/list/article/' + ${article.id}}">
            <div class="article-card__thumb" th:classappend="${article.imageFullPath == null} ? 'article-card__thumb--empty' : ''">
              <img th:if="${article.imageFullPath != null}" th:src="@{${article.imageFullPath}}" alt="" loading="lazy" />
              <span th:if="${article.imageFullPath == null}">글</span>
            </div>
            <div class="article-card__body">
              <h3 class="article-card__title" th:text="${article.title}">제목</h3>
              <p class="article-card__sub" th:text="${article.subTitle}">부제</p>
              <div class="article-card__meta">
                <span th:text="${article.nickName}">작가</span>
                <span th:text="'리뷰 ' + ${article.reviewCount}">리뷰 0</span>
              </div>
            </div>
          </a>
        </div>
      </section>

      <!-- 지금 읽기 좋은 글 -->
      <section class="public-section" th:if="${mainPageList != null and mainPageList.gudokList != null and !#lists.isEmpty(mainPageList.gudokList)}">
        <div class="section-title-row">
          <h2>지금 읽기 좋은 글</h2>
          <a class="more" th:href="@{/list/article}">더 보기 ›</a>
        </div>
        <div class="card-grid">
          <a class="article-card" th:each="article : ${mainPageList.gudokList}"
             th:href="@{'/list/article/' + ${article.id}}">
            <div class="article-card__thumb" th:classappend="${article.imageFullPath == null} ? 'article-card__thumb--empty' : ''">
              <img th:if="${article.imageFullPath != null}" th:src="@{${article.imageFullPath}}" alt="" loading="lazy" />
              <span th:if="${article.imageFullPath == null}">글</span>
            </div>
            <div class="article-card__body">
              <h3 class="article-card__title" th:text="${article.title}">제목</h3>
              <p class="article-card__sub" th:text="${article.subTitle}">부제</p>
              <div class="article-card__meta">
                <span th:text="${article.nickName}">작가</span>
                <span th:text="'찜 ' + ${article.jjimCount}">찜 0</span>
              </div>
            </div>
          </a>
        </div>
      </section>

      <!-- 이런 작가는 어때요 -->
      <section class="public-section" th:if="${mainPageList != null and mainPageList.authorList != null and !#lists.isEmpty(mainPageList.authorList)}">
        <div class="section-title-row">
          <h2>이런 작가는 어때요</h2>
          <a class="more" th:href="@{/list/author}">작가 둘러보기 ›</a>
        </div>
        <div class="author-grid">
          <a class="author-card" th:each="author : ${mainPageList.authorList}"
             th:href="@{'/list/authorPage/' + ${author.id} + '/default'}">
            <div class="author-card__avatar" th:text="${#strings.substring(author.nickName,0,1)}">B</div>
            <h3 class="author-card__name" th:text="${author.nickName}">작가</h3>
            <p class="author-card__info" th:text="${author.user_info}">소개</p>
            <span class="author-card__count" th:text="'구독자 ' + ${author.gudok_count}">구독자 0</span>
          </a>
        </div>
      </section>

      <!-- 배너 -->
      <section class="public-banner">
        <div>
          <h3>당신의 첫 글을 기다립니다</h3>
          <p>글 3편을 쓰면 작가로 성장할 수 있어요.</p>
        </div>
        <a class="ez-btn ez-btn--primary" th:href="@{/write}">글쓰기 시작하기</a>
      </section>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
  </body>
</html>
