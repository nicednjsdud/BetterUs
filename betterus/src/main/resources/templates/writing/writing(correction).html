<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글 수정 · Better Us</title>
    <link rel="stylesheet" th:href="@{/css/common/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/member/member.css}" />
  </head>
  <body class="member-page">
    <div th:replace="~{fragments/layout :: header}"></div>

    <div class="member-layout">
      <aside th:replace="~{fragments/layout :: memberNav('write')}"></aside>

      <main class="member-main">
        <h1 class="member-page-title ez-serif">글 수정</h1>
        <p class="member-page-desc">작성한 글을 고치거나 지울 수 있습니다.</p>

        <p class="ez-error" th:if="${msg}" th:text="${msg}" role="alert"></p>

        <form class="form-card" th:action="@{'/myPage/' + ${article.id} + '/edit'}" th:object="${article}"
              method="post" enctype="multipart/form-data">
          <div class="form-row">
            <label for="title">제목</label>
            <div class="form-row__body">
              <input id="title" name="title" type="text" class="ez-input" th:value="${article.title}" required />
            </div>
          </div>

          <div class="form-row">
            <label for="subTitle">부제</label>
            <div class="form-row__body">
              <input id="subTitle" name="subTitle" type="text" class="ez-input" th:value="${article.subTitle}" />
            </div>
          </div>

          <div class="form-row">
            <label for="contents">본문</label>
            <div class="form-row__body">
              <textarea id="contents" name="contents" style="min-height:320px" th:text="${article.contents}"></textarea>
            </div>
          </div>

          <div class="form-row">
            <label>현재 이미지</label>
            <div class="form-row__body">
              <img th:if="${article.fileOrginPath != null}" th:src="@{${article.fileOrginPath}}" alt=""
                   style="max-width:240px;border-radius:12px" />
              <span th:if="${article.fileOrginPath == null}" style="font-size:14px;color:var(--ez-text-muted)">등록된 이미지가 없습니다.</span>
            </div>
          </div>

          <div class="form-row">
            <label for="files">이미지 교체</label>
            <div class="form-row__body">
              <input id="files" name="files" type="file" accept="image/*" multiple
                     style="font-size:14px;color:var(--ez-text-muted)" />
              <div class="field-msg">새 이미지를 고르면 기존 이미지를 대체합니다. (선택)</div>
            </div>
          </div>

          <div class="form-actions">
            <a class="ez-btn ez-btn--text" th:href="@{/myPage/default}">취소</a>
            <button type="submit" class="ez-btn ez-btn--primary">수정 저장</button>
          </div>
        </form>

        <section class="danger-zone">
          <h3 class="ez-serif">글 삭제</h3>
          <p>삭제하면 되돌릴 수 없습니다.</p>
          <form th:action="@{'/myPage/' + ${article.id} + '/delete'}" method="post"
                onsubmit="return confirm('이 글을 삭제할까요?');">
            <button type="submit" class="ez-btn ez-btn--danger">글 삭제</button>
          </form>
        </section>
      </main>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
  </body>
</html>
