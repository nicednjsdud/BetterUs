<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 · Better Us</title>
    <link rel="stylesheet" th:href="@{/css/common/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/login/login.css}" />
  </head>
  <body class="auth-page">
    <!-- 공통 머리글 -->
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="auth-shell">
      <div class="auth-shell__overlay"></div>

      <section class="auth-card" aria-labelledby="login-title">
        <h1 id="login-title" class="auth-card__title ez-serif">로그인</h1>
        <p class="auth-card__subtitle">글을 쓰며 더 나은 ‘나’로</p>

        <!-- 회원가입 완료 안내 -->
        <p class="ez-note" th:if="${param.signup}" role="status">
          회원가입이 완료되었습니다. 로그인해 주세요.
        </p>

        <!-- 서버 검증 실패 안내 -->
        <p
          class="ez-error auth-card__error"
          th:if="${msg}"
          th:text="${msg}"
          role="alert"
        ></p>

        <form
          id="login"
          th:object="${loginForm}"
          th:action="@{/login/confirm}"
          method="post"
          novalidate
        >
          <div class="ez-field">
            <label for="email" class="auth-card__label">이메일 (로그인 아이디)</label>
            <input
              id="email"
              type="email"
              class="ez-input"
              th:classappend="${msg != null} ? 'is-invalid' : ''"
              th:field="*{email}"
              placeholder="name@example.com"
              autocomplete="username"
              required
            />
          </div>

          <div class="ez-field">
            <label for="password" class="auth-card__label">비밀번호</label>
            <input
              id="password"
              type="password"
              class="ez-input"
              th:classappend="${msg != null} ? 'is-invalid' : ''"
              th:field="*{password}"
              autocomplete="current-password"
              required
            />
          </div>

          <button class="ez-btn ez-btn--primary auth-card__submit" type="submit">
            로그인
          </button>
        </form>

        <div class="auth-card__links">
          <a th:href="@{/signUp}">회원가입</a>
          <span class="auth-card__divider" aria-hidden="true">·</span>
          <a th:href="@{/login/findPassword}">닉네임·비밀번호 찾기</a>
        </div>
      </section>
    </main>

    <!-- 공통 바닥글 -->
    <div th:replace="~{fragments/layout :: footer}"></div>

    <script th:src="@{/js/login/login.js}"></script>
  </body>
</html>
