<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>닉네임·비밀번호 찾기 · Better Us</title>
    <link rel="stylesheet" th:href="@{/css/common/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/login/findpassword.css}" />
  </head>
  <body class="find-page">
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="find-shell">
      <section class="find-card">
        <h1 class="find-card__title ez-serif">닉네임·비밀번호 찾기</h1>

        <div class="find-tabs" role="tablist">
          <button class="find-tab is-active" id="tabIdBtn" data-tab="id" role="tab" aria-selected="true">닉네임 찾기</button>
          <button class="find-tab" id="tabPwBtn" data-tab="pw" role="tab" aria-selected="false">비밀번호 찾기</button>
        </div>

        <!-- 탭 A: 닉네임 찾기 -->
        <div class="find-panel" id="panel-id" role="tabpanel">
          <p class="find-guide">로그인은 이메일로 합니다. 가입할 때 쓴 이메일로 인증하면 그 계정의 닉네임을 알려드립니다.</p>

          <div class="ez-field">
            <label for="findIdEmail">이메일</label>
            <div class="field-row">
              <input id="findIdEmail" type="email" class="ez-input" placeholder="name@example.com" />
              <button id="findIdSendBtn" type="button" class="ez-btn ez-btn--primary">인증코드 발송</button>
            </div>
            <div id="findIdEmailMsg" class="field-msg"></div>
          </div>

          <div class="ez-field">
            <label for="findIdCode">인증코드 (6자리)</label>
            <div class="field-row">
              <input id="findIdCode" type="text" class="ez-input" inputmode="numeric" maxlength="6" placeholder="메일로 받은 6자리 숫자" disabled />
              <button id="findIdVerifyBtn" type="button" class="ez-btn ez-btn--ghost" disabled>확인</button>
            </div>
            <div id="findIdCodeMsg" class="field-msg"></div>
          </div>

          <button id="findIdSubmitBtn" type="button" class="ez-btn ez-btn--primary find-submit" disabled>닉네임 확인</button>

          <div class="find-result" id="findIdResult" hidden>
            <span>회원님의 닉네임은 <strong id="findIdValue"></strong> 입니다.</span>
            <div class="find-result__action">
              <a class="ez-btn ez-btn--primary" th:href="@{/login}">로그인</a>
            </div>
          </div>
        </div>

        <!-- 탭 B: 비밀번호 찾기 -->
        <div class="find-panel" id="panel-pw" role="tabpanel" hidden>
          <p class="find-guide">가입할 때 쓴 이메일로 인증하면 임시 비밀번호를 보내드립니다. 로그인한 뒤 반드시 비밀번호를 바꿔 주세요.</p>

          <div class="ez-field">
            <label for="findPwEmail">이메일</label>
            <div class="field-row">
              <input id="findPwEmail" type="email" class="ez-input" placeholder="name@example.com" />
              <button id="findPwSendBtn" type="button" class="ez-btn ez-btn--primary">인증코드 발송</button>
            </div>
            <div id="findPwEmailMsg" class="field-msg"></div>
          </div>

          <div class="ez-field">
            <label for="findPwCode">인증코드 (6자리)</label>
            <div class="field-row">
              <input id="findPwCode" type="text" class="ez-input" inputmode="numeric" maxlength="6" placeholder="메일로 받은 6자리 숫자" disabled />
              <button id="findPwVerifyBtn" type="button" class="ez-btn ez-btn--ghost" disabled>확인</button>
            </div>
            <div id="findPwCodeMsg" class="field-msg"></div>
          </div>

          <button id="findPwSubmitBtn" type="button" class="ez-btn ez-btn--primary find-submit" disabled>임시 비밀번호 받기</button>

          <div class="find-result" id="findPwResult" hidden>
            <span>임시 비밀번호를 이메일로 보냈습니다. 로그인한 뒤 바꿔 주세요.</span>
            <div class="find-result__action">
              <a class="ez-btn ez-btn--primary" th:href="@{/login}">로그인</a>
            </div>
          </div>
        </div>

        <a class="find-back" th:href="@{/login}">로그인으로 돌아가기</a>
      </section>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script th:src="@{/js/login/findPassword.js}"></script>
  </body>
</html>
