<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 · Better Us</title>
    <link rel="stylesheet" th:href="@{/css/common/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/login/signup.css}" />
  </head>
  <body class="signup-page">
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="signup-layout">
      <!-- 좌: 브랜드 패널 -->
      <section class="signup-brand">
        <div class="signup-brand__overlay"></div>
        <div class="signup-brand__inner">
          <div class="signup-brand__logo">Better Us</div>
          <p class="signup-brand__slogan">
            글을 쓰며 더 나은 ‘나’로,<br />
            글을 나누며 더 나은 ‘우리’로
          </p>
          <p class="signup-brand__hint">
            가입 후 세 편의 글을 쓰면 작가로 성장할 수 있어요.
          </p>
        </div>
      </section>

      <!-- 우: 가입 폼 -->
      <section class="signup-panel">
        <h1 class="signup-panel__title ez-serif">회원가입</h1>
        <p class="signup-panel__sub" th:unless="${mailAuthSkip}">이메일 인증 후 계정을 만들 수 있어요.</p>
        <p class="signup-panel__sub" th:if="${mailAuthSkip}">바로 계정을 만들 수 있어요.</p>

        <p class="ez-note" th:if="${mailAuthSkip}" role="status">
          지금은 이메일 인증을 건너뛰도록 설정되어 있습니다. 인증코드 없이 바로 가입됩니다.
        </p>

        <p class="ez-error" th:if="${msg}" th:text="${msg}" role="alert"></p>

        <form
          id="signup"
          th:action="@{/signUp}"
          method="post"
          novalidate
        >
          <!-- 화면 동작용 — 이메일 인증 건너뛰기 여부 -->
          <input type="hidden" id="mailAuthSkip" th:value="${mailAuthSkip}" />

          <!-- 이메일 + 인증코드 발송 -->
          <div class="ez-field">
            <label for="email">이메일</label>
            <div class="field-row">
              <input id="email" name="email" type="email" class="ez-input"
                     th:value="${joinForm != null ? joinForm.email : ''}"
                     placeholder="가입할 이메일 주소" autocomplete="email" />
              <button id="sendCodeBtn" type="button" class="ez-btn ez-btn--primary" th:attr="hidden=${mailAuthSkip} ? 'hidden' : null">인증코드 발송</button>
            </div>
            <div id="emailMsg" class="field-msg"></div>
          </div>

          <!-- 인증코드 + 확인 -->
          <div class="ez-field" th:attr="hidden=${mailAuthSkip} ? 'hidden' : null">
            <label for="authCode">인증코드(6자리)</label>
            <div class="field-row">
              <input id="authCode" name="authCode" type="text" class="ez-input"
                     inputmode="numeric" maxlength="6"
                     th:value="${joinForm != null ? joinForm.authCode : ''}"
                     placeholder="메일로 받은 6자리 숫자" />
              <button id="verifyCodeBtn" type="button" class="ez-btn ez-btn--ghost">확인</button>
            </div>
            <div id="codeMsg" class="field-msg"></div>
          </div>

          <!-- 닉네임 + 중복확인 -->
          <div class="ez-field">
            <label for="nickname">닉네임</label>
            <div class="field-row">
              <input id="nickname" name="nickname" type="text" class="ez-input"
                     th:value="${joinForm != null ? joinForm.nickname : ''}"
                     placeholder="2~12자 (한글·영문·숫자)" />
              <button id="checkNickBtn" type="button" class="ez-btn ez-btn--ghost">중복확인</button>
            </div>
            <div id="nickMsg" class="field-msg"></div>
          </div>

          <!-- 비밀번호 -->
          <div class="ez-field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" class="ez-input"
                   placeholder="8자 이상 영문+숫자 조합" autocomplete="new-password" />
            <div id="strength" class="strength" data-level="0">
              <span></span><span></span><span></span>
            </div>
            <div id="pwMsg" class="field-msg"></div>
          </div>

          <!-- 비밀번호 확인 -->
          <div class="ez-field">
            <label for="passwordConfirm">비밀번호 확인</label>
            <input id="passwordConfirm" name="passwordConfirm" type="password" class="ez-input"
                   placeholder="비밀번호를 한 번 더 입력" autocomplete="new-password" />
            <div id="pwConfirmMsg" class="field-msg"></div>
          </div>

          <!-- 전화번호 -->
          <div class="ez-field">
            <label for="phone">전화번호 (선택)</label>
            <input id="phone" name="phone" type="tel" class="ez-input"
                   th:value="${joinForm != null ? joinForm.phone : ''}"
                   placeholder="010-0000-0000" />
            <div id="phoneMsg" class="field-msg"></div>
          </div>

          <!-- 약관 -->
          <div class="terms">
            <div class="terms__all">
              <label><input type="checkbox" id="agreeAll" /> 전체 동의</label>
            </div>
            <div class="terms__item">
              <label><input type="checkbox" class="agree" id="agreeTerms" /> (필수) 서비스 이용약관 동의</label>
            </div>
            <div class="terms__item">
              <label><input type="checkbox" class="agree" id="agreePrivacy" /> (필수) 개인정보 처리방침 동의</label>
            </div>
            <div class="terms__item">
              <label><input type="checkbox" class="agree" id="agreeMarketing" /> (선택) 마케팅 정보 수신 동의</label>
            </div>
          </div>

          <div class="signup-actions">
            <button id="signupSubmit" type="submit" class="ez-btn ez-btn--primary signup-submit">가입하기</button>
            <a class="ez-btn ez-btn--text" th:href="@{/login}">로그인으로 돌아가기</a>
          </div>
        </form>
      </section>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script th:src="@{/js/login/signUp.js}"></script>
  </body>
</html>
