<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${article.title} + ' · Better Us'">글 읽기 · Better Us</title>
    <link rel="stylesheet" th:href="@{/css/common/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/public/public.css}" />
  </head>
  <body class="public-page">
    <div th:replace="~{fragments/layout :: header}"></div>

    <article class="reading">
      <div class="reading__cover"></div>

      <h1 class="reading__title" th:text="${article.title}">제목</h1>
      <p class="reading__sub" th:text="${article.subTitle}">부제</p>

      <div class="reading__byline">
        <span th:text="${article.nickName}">작가</span>
        <span aria-hidden="true">·</span>
        <span th:text="${article.createDate}">날짜</span>
        <span aria-hidden="true">·</span>
        <span th:text="'리뷰 ' + ${article.reviewCount} + ' · 찜 ' + ${article.jjimCount}">리뷰 0</span>
      </div>

      <div class="reading__body" th:text="${article.contents}">본문</div>

      <div class="reading__figure" th:if="${article.imageFullPath != null}">
        <img th:src="@{${article.imageFullPath}}" alt="" />
      </div>

      <div class="reading__actions">
        <a class="ez-btn ez-btn--primary" th:if="${jjimCheck != true}"
           th:href="@{'/jjim/' + ${article.id} + '/addJjim'}">찜하기</a>
        <a class="ez-btn ez-btn--ghost" th:if="${jjimCheck == true}"
           th:href="@{'/jjim/' + ${article.id} + '/deleteJjim'}">찜 취소</a>
        <a class="ez-btn ez-btn--text"
           th:href="@{'/list/authorPage/' + ${article.memberId} + '/default'}">작가 페이지로</a>
      </div>
    </article>

    <div th:replace="~{fragments/layout :: footer}"></div>
  </body>
</html>
