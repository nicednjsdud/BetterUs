<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${memberDto != null ? memberDto.nickName : '작가'} + ' · Better Us'">작가 페이지 · Better Us</title>
    <link rel="stylesheet" th:href="@{/css/common/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/public/public.css}" />
    <link rel="stylesheet" th:href="@{/css/member/member.css}" />
  </head>
  <body class="public-page">
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="public-container" style="padding-top:48px">
      <!-- 작가 프로필 -->
      <section class="summary-card" style="margin-bottom:40px">
        <div class="summary-profile">
          <div class="summary-avatar" th:text="${memberDto != null and memberDto.nickName != null ? #strings.substring(memberDto.nickName,0,1) : 'B'}">B</div>
          <div>
            <h1 class="summary-nickname" th:text="${memberDto != null ? memberDto.nickName : '알 수 없는 작가'}">작가</h1>
            <span class="ez-badge">작가</span>
            <p class="summary-info" th:text="${memberDto != null ? memberDto.user_info : ''}">소개</p>
          </div>
        </div>
        <div class="summary-metrics">
          <div class="metric">
            <span class="metric__value" th:text="${memberDto != null ? memberDto.gudok_count : 0}">0</span>
            <span class="metric__label">구독자</span>
          </div>
          <div class="metric">
            <span class="metric__value" th:text="${memberDto != null ? memberDto.gudokForCount : 0}">0</span>
            <span class="metric__label">구독한 작가</span>
          </div>
          <div style="margin-left:16px" th:if="${memberDto != null}">
            <a class="ez-btn ez-btn--primary" th:if="${gudokCheck != true}"
               th:href="@{'/gudok/' + ${memberDto.id} + '/addGudok'}">구독하기</a>
            <a class="ez-btn ez-btn--ghost" th:if="${gudokCheck == true}"
               th:href="@{'/gudok/' + ${memberDto.id} + '/deleteGudok'}">구독 취소</a>
          </div>
        </div>
      </section>

      <div class="section-title-row">
        <h2>작가의 글</h2>
        <span class="more" th:text="${#lists.size(articleDtoList)} + '편'">0편</span>
      </div>

      <div class="empty-state" th:if="${articleDtoList == null or #lists.isEmpty(articleDtoList)}">
        <img th:src="@{/img/empty-library.jpg}" alt="" style="width:200px" />
        <p>아직 공개된 글이 없어요.</p>
      </div>

      <div class="card-grid" th:unless="${articleDtoList == null or #lists.isEmpty(articleDtoList)}">
        <a class="article-card" th:each="article : ${articleDtoList}"
           th:href="@{'/list/article/' + ${article.id}}">
          <div class="article-card__thumb" th:classappend="${article.imageFullPath == null} ? 'article-card__thumb--empty' : ''">
            <img th:if="${article.imageFullPath != null}" th:src="@{${article.imageFullPath}}" alt="" loading="lazy" />
            <span th:if="${article.imageFullPath == null}">글</span>
          </div>
          <div class="article-card__body">
            <h3 class="article-card__title" th:text="${article.title}">제목</h3>
            <p class="article-card__sub" th:text="${article.subTitle}">부제</p>
            <div class="article-card__meta">
              <span th:text="'리뷰 ' + ${article.reviewCount}">리뷰 0</span>
              <span th:text="'찜 ' + ${article.jjimCount}">찜 0</span>
            </div>
          </div>
        </a>
      </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
  </body>
</html>
