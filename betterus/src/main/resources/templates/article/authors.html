<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>작가 둘러보기 · Better Us</title>
    <link rel="stylesheet" th:href="@{/css/common/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/public/public.css}" />
  </head>
  <body class="public-page">
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="public-container" style="padding-top:48px">
      <p class="ez-note" th:if="${msg}" th:text="${msg}" role="status"></p>

      <h1 class="ez-serif" style="font-size:30px;margin:0 0 8px">작가 둘러보기</h1>
      <p style="font-size:14px;color:var(--ez-text-muted);margin:0"
         th:text="${param.searchKeyword != null and !#strings.isEmpty(param.searchKeyword)}
                  ? '‘' + ${param.searchKeyword} + '’ 검색 결과 ' + ${authorList.totalElements} + '명'
                  : '구독자가 많은 작가 ' + ${authorList.totalElements} + '명'">작가 목록</p>

      <form class="search-bar" method="GET" th:action="@{/list/author/search}">
        <input type="text" name="searchKeyword" class="ez-input"
               th:value="${param.searchKeyword}" placeholder="작가 이름으로 검색" />
        <button type="submit" class="ez-btn ez-btn--primary">검색</button>
        <a class="ez-btn ez-btn--ghost" th:if="${param.searchKeyword != null and !#strings.isEmpty(param.searchKeyword)}"
           th:href="@{/list/author}">초기화</a>
      </form>

      <div class="empty-state" th:if="${authorList == null or authorList.totalElements == 0}">
        <img th:src="@{/img/empty-library.jpg}" alt="" style="width:200px" />
        <p>조건에 맞는 작가가 없어요.</p>
        <a class="ez-btn ez-btn--primary" th:href="@{/list/author}">전체 보기</a>
      </div>

      <div class="author-grid" th:unless="${authorList == null or authorList.totalElements == 0}">
        <a class="author-card" th:each="author : ${authorList.content}"
           th:href="@{'/list/authorPage/' + ${author.id} + '/default'}">
          <div class="author-card__avatar" th:text="${#strings.substring(author.nickName,0,1)}">B</div>
          <h3 class="author-card__name" th:text="${author.nickName}">작가</h3>
          <p class="author-card__info" th:text="${author.user_info}">소개</p>
          <span class="author-card__count" th:text="'구독자 ' + ${author.gudok_count} + ' · 구독 중 ' + ${author.gudokForCount}">구독자 0</span>
        </a>
      </div>

      <nav class="pagination" th:if="${authorList != null and authorList.totalPages > 1}">
        <th:block th:each="page : ${#numbers.sequence(startPage, endPage)}">
          <a th:if="${page != nowPage}"
             th:href="${param.searchKeyword != null and !#strings.isEmpty(param.searchKeyword)}
                      ? @{/list/author/search(searchKeyword=${param.searchKeyword}, page=${page-1})}
                      : @{/list/author(page=${page-1})}"
             th:text="${page}">1</a>
          <span class="is-current" th:if="${page == nowPage}" th:text="${page}">1</span>
        </th:block>
      </nav>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
  </body>
</html>
